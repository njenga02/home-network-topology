<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Home Network Topology</text>

  <!-- Internet cloud -->
  <ellipse cx="450" cy="90" rx="90" ry="35" fill="#d0e8ff" stroke="#1a73e8" stroke-width="2"/>
  <text x="450" y="96" text-anchor="middle" font-size="15" fill="#1a1a2e">Internet (ISP)</text>

  <!-- Line to router -->
  <line x1="450" y1="125" x2="450" y2="175" stroke="#333" stroke-width="2"/>

  <!-- Router -->
  <rect x="380" y="175" width="140" height="55" rx="8" fill="#1a73e8"/>
  <text x="450" y="198" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Router / Gateway</text>
  <text x="450" y="216" text-anchor="middle" font-size="12" fill="#e8f0fe">192.168.1.1</text>

  <!-- Line to switch -->
  <line x1="450" y1="230" x2="450" y2="280" stroke="#333" stroke-width="2"/>

  <!-- Switch -->
  <rect x="380" y="280" width="140" height="50" rx="8" fill="#34a853"/>
  <text x="450" y="302" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Switch</text>
  <text x="450" y="319" text-anchor="middle" font-size="11" fill="#e6f4ea">8-port LAN switch</text>

  <!-- Branch lines to 4 devices -->
  <line x1="450" y1="330" x2="150" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="330" x2="350" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="330" x2="550" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="330" x2="750" y2="400" stroke="#333" stroke-width="1.5"/>

  <!-- Device boxes -->
  <g>
    <rect x="90" y="400" width="120" height="55" rx="6" fill="#fbbc04"/>
    <text x="150" y="422" text-anchor="middle" font-size="12" font-weight="bold">Desktop PC</text>
    <text x="150" y="438" text-anchor="middle" font-size="11">192.168.1.10</text>
  </g>
  <g>
    <rect x="290" y="400" width="120" height="55" rx="6" fill="#fbbc04"/>
    <text x="350" y="422" text-anchor="middle" font-size="12" font-weight="bold">Wi-Fi AP</text>
    <text x="350" y="438" text-anchor="middle" font-size="11">192.168.1.20</text>
  </g>
  <g>
    <rect x="490" y="400" width="120" height="55" rx="6" fill="#fbbc04"/>
    <text x="550" y="422" text-anchor="middle" font-size="12" font-weight="bold">Laptop (Wi-Fi)</text>
    <text x="550" y="438" text-anchor="middle" font-size="11">192.168.1.30</text>
  </g>
  <g>
    <rect x="690" y="400" width="120" height="55" rx="6" fill="#fbbc04"/>
    <text x="750" y="422" text-anchor="middle" font-size="12" font-weight="bold">Smart Printer</text>
    <text x="750" y="438" text-anchor="middle" font-size="11">192.168.1.40</text>
  </g>

  <text x="450" y="495" text-anchor="middle" font-size="12" fill="#666">Subnet: 192.168.1.0/24  |  Gateway: 192.168.1.1  |  DNS: 8.8.8.8</text>
</svg>
